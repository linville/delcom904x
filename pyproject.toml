[project]
name = "delcom904x"
version = "0.5.0"
description = "A python module to control Delcom USBLMP Products 904x multi-color, USB, visual signal indicators"
readme = "README.md"
requires-python = ">=3.11"
license = "ISC"
authors = [
  {name = "Aaron Linville", email = "aaron@linville.org"},
]

keywords = ["hidapi", "usb-hid", "iot-device"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: System :: Hardware :: Hardware Drivers",
  "Topic :: Home Automation",
  "Development Status :: 5 - Production/Stable",
]

dependencies = [
  "hidapi==0.15.*",
]

[project.optional-dependencies]
dev = [
  "black==26.10.*",
  "build==1.6.*",
  "ruff==0.17.*",
  "twine==7.0.*",
]

[project.urls]
Homepage = "https://github.com/linville/delcom904x/"
Changelog = "https://github.com/linville/delcom904x/blob/main/CHANGELOG.md"
Issues = "https://github.com/linville/delcom904x/issues"

[project.scripts]
control-delcom904x = "delcom904x.cli:main"

[build-system]
requires = ["setuptools >= 80.9"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.ruff]
# Oldest supported version (used by UP).
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]
select = [
  "A",   # built-ins
  "B",   # flake8-bugbear
  "E",   # pycodestyle
  "F",   # pyflakes
  "FBT", # flake8-boolean-trap
  "I",   # isort
  "PIE", # various unnecessary
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
]
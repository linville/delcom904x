name: Lint, Package, Publish

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Lint and Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install CI Utilities
      run: |
        pip install pip-tools==7.*
        pip-compile --extra dev -o - pyproject.toml | pip install -r /dev/stdin -U

    - name: Lint
      run: |
        black --check .
        ruff check .

    - name: Package
      run: |
        python -m build
        twine check dist/*

    - name: Upload Package Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Package Artifacts
        path: dist/
        if-no-files-found: error

  test:
    name: Test Packages
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
          matrix:
            python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download the distribution artifacts.
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Package Artifacts

    - name: Smoke Check
      run: |
        pip install *.whl
        control-delcom904x --help

  publish-to-testpypi:
    name: Publish to TestPyPi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/test-v')
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/delcom904x
    permissions:
      id-token: write

    steps:
    - name: Download the distribution artifacts.
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Package Artifacts
        path: dist/

    - name: Publish packages to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/delcom904x
    permissions:
      id-token: write

    steps:
    - name: Download the distribution artifacts.
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: Package Artifacts
        path: dist/

    - name: Publish packages to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
